# Заглушка на время недоступности основного сайта.
# Отдаёт maintenance.html со статусом 503 на ЛЮБОЙ путь
# (/watch/..., /_next/static/..., /api/... — всё равно, Next.js всё равно
# недоступен, иначе запрос не дошёл бы в этот контейнер).
#
# Важно: статус именно 503 (не 200):
#  - поисковики трактуют 503 + Retry-After как «временно», индекс не выкидывают;
#  - JS на странице отличает заглушку (503) от живого Next (404 на пробку)
#    и делает reload, когда сайт ожил.
#
# Исключения (нужны самой странице):
#  /maintenance.html        — сама страница (реальный файл, отдаётся и напрямую);
#  /fonts/*.woff2           — шрифты сайта (Unbounded/Inter/JetBrains Mono),
#                             та же структура, что в public/fonts;
#  /assets/                 — брендовая иллюстрация из public.
# Когда сайт жив, эти пути всё равно уходят в Next (прокси не смотрит в заглушку).

server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;

  error_page 503 /maintenance.html;

  add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  add_header Retry-After "300" always;
  # Диагностическая метка: на живом проде этот заголовок отсутствует.
  add_header X-Weebx-Fallback "1" always;

  # Статические ассеты страницы: отдаём с 200 и лёгким кэшем.
  location /fonts/ {
    types { font/woff2 woff2; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }
  location /assets/ {
    types { image/png png; }
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location = /maintenance.html {
    default_type text/html;
  }

  location / {
    return 503;
  }
}
