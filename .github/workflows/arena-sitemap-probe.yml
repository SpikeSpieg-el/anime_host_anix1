name: Arena Sitemap Probe

# Временный диагностический workflow (ветка arena/...).
# Тянет живой sitemap.xml, складывает его и краткий отчёт в .arena/ и коммитит
# обратно в ветку, потому что скачать artifacts/logs из этой песочницы нельзя.
on:
  push:
    paths:
      - .github/workflows/arena-sitemap-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch live sitemap
        run: |
          set -o pipefail
          curl -sS --compressed -D /tmp/headers.txt -o /tmp/sitemap.xml --max-time 90 https://weeb-x.com/sitemap.xml
          mkdir -p .arena
          cp /tmp/sitemap.xml .arena/sitemap-live.xml
          {
            echo '===== RESPONSE HEADERS ====='
            cat /tmp/headers.txt
            echo '===== SIZE ====='
            wc -c -l /tmp/sitemap.xml
            md5sum /tmp/sitemap.xml
            echo '===== LINES 640-670 ====='
            sed -n '640,670p' /tmp/sitemap.xml
            echo '===== LINE 651 (octal dump) ====='
            sed -n '651p' /tmp/sitemap.xml | od -c | head -10
            echo '===== COUNTS ====='
            printf 'url tags: '; grep -c '<url>' /tmp/sitemap.xml || true
            printf 'image:loc tags: '; grep -c '<image:loc>' /tmp/sitemap.xml || true
            printf 'lastmod tags: '; grep -c '<lastmod>' /tmp/sitemap.xml || true
            echo '===== AMPERSANDS ====='
            grep -n '&' /tmp/sitemap.xml | head -20 || echo 'no ampersands at all'
            echo '===== NON-ASCII LINES ====='
            grep -nP '[^\x09\x0A\x0D\x20-\x7E]' /tmp/sitemap.xml | head -10 || echo 'pure ASCII'
          } > .arena/sitemap-report.txt
          cat .arena/sitemap-report.txt

      - name: Sanity-check some URLs (status codes)
        run: |
          {
            echo '===== HTTP STATUS OF SAMPLE PAGES ====='
            for u in \
              "https://weeb-x.com/watch/1735-naruto-uragannye-khroniki" \
              "https://weeb-x.com/watch/9253-vrata-shteyna" \
              "https://weeb-x.com/watch/33486-moya-geroyskaya-akademiya-2" \
              "https://weeb-x.com/" \
              "https://weeb-x.com/catalog" ; do
              printf '%s -> ' "$u"
              curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' --max-time 30 "$u"
            done
          } >> .arena/sitemap-report.txt
          tail -20 .arena/sitemap-report.txt

      - name: Publish artifacts to branch
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f .arena
          git commit -m "chore(seo): снимок живого sitemap.xml и отчёт валидации [skip ci]" || echo "nothing to commit"
          git push
