name: Arena Sitemap Probe 2

# Диагностика #2: как sitemap.xml отдаётся разным User-Agent / Accept-Encoding,
# не отличается ли кэш, живут ли альтернативные sitemap-файлы и картинки.
on:
  push:
    paths:
      - .github/workflows/arena-sitemap-probe2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare variants
        run: |
          set -x
          U=https://weeb-x.com/sitemap.xml
          mkdir -p .arena
          R=.arena/sitemap-variants.txt
          : > $R

          echo "### plain (default curl UA, no Accept-Encoding)" >> $R
          curl -sS -o /tmp/a.xml -D /tmp/a.h $U --max-time 60
          wc -c /tmp/a.xml >> $R; md5sum /tmp/a.xml >> $R; grep -iE 'content-|vary|cache|x-nextjs' /tmp/a.h >> $R

          echo "### YandexBot UA + gzip" >> $R
          curl -sS -H 'User-Agent: Mozilla/5.0 (compatible; YandexBot/3.0; +http://yandex.com/bots)' \
               -H 'Accept-Encoding: gzip, deflate, br' --compressed -o /tmp/b.xml -D /tmp/b.h $U --max-time 60
          wc -c /tmp/b.xml >> $R; md5sum /tmp/b.xml >> $R; grep -iE 'content-|vary|cache|x-nextjs' /tmp/b.h >> $R

          echo "### Googlebot UA + gzip" >> $R
          curl -sS -H 'User-Agent: Mozilla/5.0 (compatible; Googlebot/2.1; +http://www.google.com/bot.html)' \
               -H 'Accept-Encoding: gzip' --compressed -o /tmp/c.xml -D /tmp/c.h $U --max-time 60
          wc -c /tmp/c.xml >> $R; md5sum /tmp/c.xml >> $R

          echo "### HTTP/1.1, no compression" >> $R
          curl -sS --http1.1 -o /tmp/d.xml -D /tmp/d.h $U --max-time 60
          wc -c /tmp/d.xml >> $R; md5sum /tmp/d.xml >> $R; grep -iE 'content-|transfer' /tmp/d.h >> $R

          echo "### cache-buster ?cb=$(date +%s)" >> $R
          curl -sS --compressed -o /tmp/e.xml -D /tmp/e.h "$U?cb=$(date +%s)" --max-time 60
          wc -c /tmp/e.xml >> $R; md5sum /tmp/e.xml >> $R; grep -iE 'content-|cache|x-nextjs' /tmp/e.h >> $R
          head -3 /tmp/a.xml >> $R; head -3 /tmp/e.xml >> $R

          echo "### HEAD" >> $R
          curl -sSI $U --max-time 30 >> $R

          echo "### alternative sitemap files" >> $R
          for p in /sitemap_index.xml /sitemap-0.xml /sitemap.xml.gz /sitemap1.xml /robots.txt; do
            printf '%s -> ' "$p" >> $R
            curl -s -o /dev/null -w '%{http_code} %{size_download}\n' --max-time 30 "https://weeb-x.com$p" >> $R
          done

          echo "### image availability (line 651 image + samples)" >> $R
          for img in \
            "https://shikimori.one/system/animes/original/1735.jpg?1711965662" \
            "https://shikimori.one/system/animes/original/9253.jpg?1711975211" \
            "https://s4.anilist.co/file/anilistcdn/media/anime/cover/large/bx189046-yaHWtS5FII46.jpg" \
            "https://media.kitsu.app/anime/50760/poster_image/5eba2c173ebaa9a1ace2dd17bfaf3679.jpg" ; do
            printf '%s -> ' "$img" >> $R
            curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}\n' --max-time 30 -r 0-1024 "$img" >> $R
          done

          cat $R

      - name: Publish report
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f .arena
          git commit -m "chore(seo): отчёт probe #2 [skip ci]" || echo nothing
          git push
