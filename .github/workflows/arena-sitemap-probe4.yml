name: Arena Sitemap Probe 4

# Диагностика #4: проверяем ВСЕ <image:loc> из живого sitemap — коды ответа и типы.
on:
  push:
    paths:
      - .github/workflows/arena-sitemap-probe4.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sweep all image URLs
        run: |
          mkdir -p .arena
          R=.arena/image-sweep.txt
          : > $R
          n=0
          grep -o '<image:loc>[^<]*</image:loc>' .arena/sitemap-live.xml | sed 's/<[^>]*>//g' | nl -ba | while read -r idx u; do
            n=$((n+1))
            raw=$(curl -sS -o /dev/null -w '%{http_code} %{content_type} %{redirect_url}' --max-time 25 -r 0-2047 "$u" 2>/dev/null)
            fin=$(curl -sS -o /dev/null -L -w '%{http_code} %{content_type} %{size_download}' --max-time 40 -r 0-2047 "$u" 2>/dev/null)
            case "$fin" in
              "200 image/"*) : ;;
              *) printf 'line-block #%s %s\n   raw=%s\n   final=%s\n' "$idx" "$u" "$raw" "$fin" >> $R ;;
            esac
          done
          echo "--- sweep done; FILE: ---" >> $R
          wc -l $R >> $R
          head -80 $R

      - name: Publish report
        run: |
          git config user.name "arena-ai-coding-agent[bot]"
          git config user.email "arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add -f .arena
          git commit -m "chore(seo): отчёт probe #4 (все картинки) [skip ci]" || echo nothing
          git push
